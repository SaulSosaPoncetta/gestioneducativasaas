# /etc/nginx/sites-available/geducativa.migestion.com.ar
# Referencia. Si el sitio ya existe con HTTPS (certbot), alcanza con revisar
# root, client_max_body_size y el bloque de PHP.
server {
    listen 80;
    server_name geducativa.migestion.com.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geducativa.migestion.com.ar;

    ssl_certificate     /etc/letsencrypt/live/geducativa.migestion.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geducativa.migestion.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gestioneducativa/public;
    index index.php;
    charset utf-8;

    # Adjuntos de comunicados: hasta 10 MB.
    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos de Vite con hash: caché larga.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
